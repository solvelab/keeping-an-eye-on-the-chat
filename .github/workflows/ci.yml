name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Runs on the same ref queue instead of overlapping. Without this, merging a
# stack of pull requests starts several semantic-release runs at once: they all
# compute a version from the same tag and race to push it, so the losers fail on
# a non-fast-forward push and the release state becomes ambiguous.
#
# cancel-in-progress is deliberately false. Cancelling a superseded run would
# silently drop the release for the commit that started it, which is worse than
# waiting a couple of minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default. Only the jobs that publish widen it.
permissions:
  contents: read

jobs:
  lint:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit-message check needs to walk the range this
      # push or pull request adds, not just the tip.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # A line beginning with "breaking change" is read by the changelog parser
      # as a BREAKING CHANGE footer, in any case and with or without a colon.
      # That once forced a major release with mangled notes (see #31).
      - name: Commit message notes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          node scripts/check-commit-notes.js "$RANGE"

      - name: Type check
        run: npm run typecheck

      - name: Packaging consistency
        run: npm run check-packaging

      - name: Unit tests
        run: npm test

      - name: Build TypeScript
        run: npm run build:ts

  release:
    name: Semantic Release
    needs: [lint]
    # Never on a pull request: a PR must be validated, never published. The
    # guard is explicit rather than implied by the trigger list, so adding a
    # trigger later cannot accidentally publish from one.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/npm
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Electron Windows
    needs: [release]
    if: github.event_name != 'pull_request' && needs.release.outputs.new_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # The release job pushed a "chore(release)" commit and a tag after this
      # workflow started, so the default checkout would build the pre-release
      # tree. Checking out the tag is what makes package.json carry the released
      # version, which is why no manual "npm version" step is needed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (ZIP + EXE)
        run: npm run build:ts && npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=false electron-builder --win zip nsis --publish never

      - name: Upload to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            release/*.zip
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Electron Linux
    needs: [release]
    if: github.event_name != 'pull_request' && needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release job pushed a "chore(release)" commit and a tag after this
      # workflow started, so the default checkout would build the pre-release
      # tree. Checking out the tag is what makes package.json carry the released
      # version, which is why no manual "npm version" step is needed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux (AppImage)
        run: npm run build:ts && npx electron-builder --linux AppImage --publish never

      - name: Upload to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
