<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    />
    <title>Configuration - Keeping an Eye on the Chat</title>
    <link rel="stylesheet" href="./styles/configWindow.css" />
  </head>
  <body>
    <div class="config-app">
      <header class="config-header">
        <div class="header-actions">
          <div class="language-toggle" id="languageToggle">
            <button type="button" class="lang-btn" data-lang="en" title="English">
              🇺🇸
            </button>
            <button type="button" class="lang-btn" data-lang="pt" title="Português">
              🇧🇷
            </button>
          </div>
          <button type="button" class="donate-btn" id="donateBtn" title="Support this project">
            <span class="donate-icon">❤️</span>
            <span class="donate-text">Donate</span>
          </button>
        </div>
        <img
          src="./assets/logo.png"
          alt="Logo"
          class="header-logo header-logo--clickable"
          width="64"
          height="64"
          id="headerLogo"
          title="Created by: didevlab"
        />
        <h1 class="header-title" id="headerTitle">Keeping an Eye on the Chat</h1>
        <p class="header-subtitle" id="headerSubtitle">Configure your chat overlay</p>
      </header>

      <div class="config-alerts" id="alerts"></div>

      <main class="config-main">
        <div class="presets-bar" id="presetsBar">
          <label for="presetSelect" id="quickSetupLabel">Quick Setup:</label>
          <select id="presetSelect" class="form-select">
            <option value="" id="selectPresetOption">-- Select Preset --</option>
          </select>
        </div>

        <form id="configForm" class="config-form">
          <!-- Basic Section (always visible) -->
          <section class="config-section" data-section="basic">
            <h2 class="section-title">
              <span class="section-icon">&#9881;</span>
              <span id="sectionBasicTitle">Basic Settings</span>
            </h2>
            <div class="section-content" id="section-basic"></div>
          </section>

          <!-- Overlay Section (collapsible, collapsed by default) -->
          <section class="config-section config-section--collapsed" data-section="overlay">
            <h2 class="section-title section-title--collapsible">
              <button type="button" class="section-toggle" id="overlayToggle" aria-expanded="false">
                <span class="section-icon">&#9638;</span>
                <span id="sectionOverlayTitle">Overlay Settings</span>
                <span class="toggle-icon" aria-hidden="true">+</span>
              </button>
            </h2>
            <div class="section-content" id="section-overlay" hidden></div>
          </section>

          <!-- Sound Section (collapsible, collapsed by default) -->
          <section class="config-section config-section--collapsed" data-section="sound">
            <h2 class="section-title section-title--collapsible">
              <button type="button" class="section-toggle" id="soundToggle" aria-expanded="false">
                <span class="section-icon">&#128276;</span>
                <span id="sectionSoundTitle">Sound</span>
                <span class="toggle-icon" aria-hidden="true">+</span>
              </button>
            </h2>
            <div class="section-content" id="section-sound" hidden></div>
          </section>

          <!-- Performance Section (collapsible, collapsed by default) -->
          <section class="config-section config-section--collapsed" data-section="performance">
            <h2 class="section-title section-title--collapsible">
              <button type="button" class="section-toggle" id="performanceToggle" aria-expanded="false">
                <span class="section-icon">&#9889;</span>
                <span id="sectionPerformanceTitle">Performance</span>
                <span class="toggle-icon" aria-hidden="true">+</span>
              </button>
            </h2>
            <div class="section-content" id="section-performance" hidden></div>
          </section>

          <!-- Advanced Section (collapsed by default) -->
          <section class="config-section config-section--collapsed" data-section="advanced">
            <h2 class="section-title section-title--collapsible">
              <button type="button" class="section-toggle" id="advancedToggle" aria-expanded="false">
                <span class="section-icon">&#9881;</span>
                <span id="sectionAdvancedTitle">Advanced Settings</span>
                <span class="toggle-icon" aria-hidden="true">+</span>
              </button>
            </h2>
            <div class="section-content" id="section-advanced" hidden></div>
          </section>
        </form>
      </main>

      <footer class="config-footer">
        <div class="footer-left">
          <button type="button" id="resetBtn" class="btn btn--secondary">
            <span id="resetBtnText">Reset to Defaults</span>
          </button>
        </div>
        <div class="footer-right">
          <button type="button" id="cancelBtn" class="btn btn--secondary">
            <span id="cancelBtnText">Cancel</span>
          </button>
          <button type="button" id="startBtn" class="btn btn--primary" disabled>
            <span id="startBtnText">Start Overlay</span>
          </button>
        </div>
      </footer>
    </div>

    <!-- Connection Test Modal -->
    <div id="connectionModal" class="modal" hidden>
      <div class="modal-content">
        <div class="modal-spinner"></div>
        <p class="modal-text" id="modalText">Testing connection...</p>
      </div>
    </div>

    <!-- Scripts -->
    <script>
      var exports = {};
    </script>
    <!-- Generated from src/renderer/config/locales/*.json by copy-assets.js.
         Must precede configApp.js, which reads window.configTranslations. -->
    <script src="./scripts/translations.js"></script>
    <script src="./scripts/configValues.js"></script>
    <script src="./scripts/configForm.js"></script>
    <script src="./scripts/configApp.js"></script>
  </body>
</html>
